# Project options codegate asks about. Not installed into projects.
#
# install asks every option; update asks only the keys the project's manifest does not
# have yet, so adding an option here is how a new question reaches existing projects.
# Answers live in the manifest under `options:`; workflow steps read them with
# `.claude/scripts/cg-option.sh <key>`.
#
# Each entry: key, question (shown to the user), default (how to propose a value),
# choices (when the answer is one of a fixed set).

- key: base_branch
  question: Which branch do task branches start from and merge back into?
  default: >
    The first of dev, develop, development that exists on origin
    (`git ls-remote --heads origin <name>`); if none does, main, then master.
    Propose it and let the user confirm or name another branch.

- key: branch_pattern
  question: How are task branches named?
  default: >
    `{type}/{ticket}-{slug}`. {type} is feature, bugfix or refactor; {ticket} is the task's
    tracker key (e.g. ABC-123); {slug} is a short kebab-case summary. If the project's
    existing branches (`git branch -r`) follow another shape, propose that shape instead.

- key: tracker
  question: >
    Should the workflow keep an issue tracker in sync? With one, a task is created (or
    taken up) there when it starts — its key names the branch — and the tracker hears
    when the task's PR/MR exists.
  choices: none, adapter
  default: >
    none. On `adapter`, the project provides its own adapter, in one or both forms:
    .claude/tracker-adapter.py — a Python script for its tracker that honours the contract
    in .claude/scripts/tracker.py's docstring (used by hooks and events); and/or
    .claude/tracker.md — how to perform each action (create, get, comment, link, list mine)
    with the tools the user's AI already has for that tracker, e.g. an MCP server. Codegate
    ships no adapter and knows no tracker. Ask what the user's AI uses to reach the tracker
    (MCP, API, CLI) and offer to write the adapter together — config and credentials are
    the project's business, credentials never in the repo. Verify with
    `python3 .claude/scripts/tracker.py check` and `tracker.py capabilities`.

- key: consumers
  question: >
    Which other projects consume this repository's changes — other services or apps — and
    so may need a linked task when an API or shared data changes?
    Give each a short alias; the tracker adapter maps aliases to tracker projects.
  default: >
    Empty (none). Propose aliases only if the project's own docs or the tracker clearly
    name consumers. Format: comma-separated aliases.

- key: tech_debt_in_git
  question: >
    Keep the tech-debt notes the workflow logs (`.ai/tech-debt/`, a few short files per
    task) in git, shared with the team, or only on this machine? Session files are always
    kept out of git.
  choices: yes, no
  default: >
    yes when `.ai/tech-debt/` already has tracked files (`git ls-files .ai/tech-debt`),
    otherwise ask without a proposal.

- key: pr_command
  question: >
    Does this project open PRs/MRs its own way — flags or push options the team requires?
    Without it the workflow uses the host's CLI (gh, glab), or GitLab push options.
  default: >
    Empty: the usual way. Otherwise one command line with the placeholders {branch},
    {target}, {title} and {description_file}. Propose one only when the project's own rules
    (its CLAUDE.md, CONTRIBUTING) prescribe how PRs/MRs are created.

- key: test_command
  question: >
    How is the project's full test suite run, with coverage? The workflow runs it at least
    twice per task: as the baseline before any code, and for diff coverage in the quality
    gate; each later coverage re-check (after a fix, in rework) is another full run.
  default: >
    Empty: the stack's usual command (`npx vitest run --coverage`, `npx jest --coverage`,
    `./gradlew test jacocoTestReport`, `mvn test`). Set it when the project runs its suite differently — a wrapper
    script, another runner, extra flags. Codegate only calls the command;
    it must leave a coverage report where the stack's diff-coverage looks for it.
