name: kotlin-spring
description: Kotlin/JVM backend with Spring Boot (or Ktor)
detect:
  any_of:
    - build_file_contains: ["build.gradle.kts", "build.gradle"]
      tokens:
        - "org.springframework.boot"
        - "io.ktor.plugin"
    - file_contains: ["pom.xml"]
      tokens:
        - "spring-boot-starter"
overrides:
  - .claude/agents/codebase-intelligence/CODEBASE_CONTEXT.template.md
  - .claude/agents/codebase-intelligence/linters.md
  - .claude/agents/codebase-intelligence/prompt.md
  - .claude/agents/codebase-intelligence/tech-debt.template.md
  - .claude/agents/elicitation/checklists/feature.md
  - .claude/agents/quality-gate/prompt.md
  - .claude/agents/quality-gate-arch-code/prompt.md
  - .claude/agents/quality-gate-security/prompt.md
  - .claude/scripts/diff-coverage.py
